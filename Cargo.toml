[package]
name = "llm-index"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "llm_index"
path = "src/lib.rs"

[[bin]]
name = "llm-index"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1.2.1"
blake3 = "1.8.7"
scraper = "0.29.0"
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_latest", "thread_safe"] }
calamine = "0.38.0"
csv = "1.4.0"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
quick-xml = "0.42.0"

[dev-dependencies]
landlock = "0.4.7"
