[package]
name = "llm-index"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "llm_index"
path = "src/lib.rs"

[[bin]]
name = "llm-index"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1.2.1"
blake3 = "1.8.7"
landlock = "0.4.7"
rustix = { version = "1.1.6", features = ["fs", "process"] }
ignore = "0.4.34"
inotify = { version = "0.11.5", default-features = false }
serde_json = "1"

