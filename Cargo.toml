[package]
name = "llm-index"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "llm_index"
path = "src/lib.rs"

[[bin]]
name = "llm-index"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1.2.1"
blake3 = "1.8.7"
rusqlite = { version = "0.42", features = ["bundled", "functions", "limits"] }
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
safetensors = "0.8"
memmap2 = "0.9"
serde_json = "1"

[dev-dependencies]
landlock = "0.4.7"
