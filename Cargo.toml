[package]
name = "llm-index"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "llm_index"
path = "src/lib.rs"

[[bin]]
name = "llm-index"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1.2.1"
blake3 = "1.8.7"
scraper = "0.29.0"
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_latest", "thread_safe"] }
calamine = "0.38.0"
csv = "1.4.0"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
quick-xml = "0.42.0"
landlock = "0.4.7"
rustix = { version = "1.1.6", features = ["event", "fs", "process"] }
ignore = "0.4.34"
inotify = { version = "0.11.5", default-features = false }
serde_json = "1"
tree-sitter = "0.27.2"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-nix = "0.3"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-bash = "0.25"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-json = "0.24"
text-splitter = { version = "0.33.2", features = ["markdown", "code"] }


